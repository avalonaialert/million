name: Update S&P 500 data

on:
  schedule:
    # Weekdays at 10 AM, 12 PM, 3 PM and 5 PM US Eastern. GitHub cron is UTC-only, so both
    # the standard-time and daylight-time UTC hours are listed; the "eastern-time" job
    # below lets through only the set that matches New York's current offset.
    - cron: "0 15,17,20,22 * * 1-5"  # EST (UTC-5): 10 AM, 12 PM, 3 PM, 5 PM
    - cron: "0 14,16,19,21 * * 1-5"  # EDT (UTC-4): 10 AM, 12 PM, 3 PM, 5 PM
  workflow_dispatch: # on-demand run from the Actions tab
    inputs:
      full:
        description: "Re-download full history for every symbol"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  eastern-time:
    # Decide whether this scheduled run is the one for New York's current offset.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          zone=$(TZ=America/New_York date +%Z)   # EST or EDT
          case "$SCHEDULE" in
            "0 15,17,20,22 * * 1-5") want=EST ;;
            "0 14,16,19,21 * * 1-5") want=EDT ;;
            *) want="" ;;
          esac
          if [ "$EVENT" != "schedule" ] || [ "$zone" = "$want" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: this is the $want schedule but New York is on $zone."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: eastern-time
    if: needs.eastern-time.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download data
        # The script exits non-zero if any single symbol fails; still commit
        # whatever downloaded successfully.
        run: |
          python download_sp500.py --output-dir data ${{ inputs.full && '--full' || '' }} || echo "::warning::Some symbols failed to download"

      - name: Generate index.html
        run: python generate_supertrend.py --data-dir data --output index.html --alert-file "$RUNNER_TEMP/alert.txt"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add data index.html
          # Skip the commit when nothing changed except the page's "Updated" timestamp line.
          page_changes=$(git diff --cached -U0 -- index.html | grep '^[-+][^-+]' | grep -v 'class="updated"' || true)
          if git diff --cached --quiet -- data && [ -z "$page_changes" ]; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update S&P 500 data and index.html ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase
          git push

      - name: Email new signals
        # Runs after the push so a mail problem never blocks the data update,
        # and still runs if the push itself failed.
        if: ${{ !cancelled() }}
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python send_alert_email.py "$RUNNER_TEMP/alert.txt"
